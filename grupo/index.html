<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* paleta tirada do print de referencia */
  --bg:#191919;        /* fundo                    */
  --panel:#252525;     /* blocos e barra           */
  --edge:#0e0e0e;      /* topo e rodape            */
  --line:#333;
  --ink:#fff;
  --dim:#9a9a9a;
  --faint:#6f6f6f;
  --alert:#fd3337;     /* "OBRIGATORIO" e escassez */
  --cta:#25d366;       /* verde do WhatsApp        */
  --cta2:#1fbb5a;
  --wrap:420px;
}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);
  font:400 16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;flex-direction:column;
}
.wrap{width:100%;max-width:var(--wrap);margin:0 auto;padding:0 22px}

/* ---------- topo ---------- */
.top{background:var(--edge);padding:14px 0;text-align:center}
.top span{font-size:10.5px;letter-spacing:.22em;color:var(--faint);font-weight:700}

/* ---------- miolo ---------- */
main{flex:1;padding:30px 0 34px;text-align:center}

.logo{
  width:96px;height:96px;border-radius:50%;object-fit:cover;
  margin:0 auto 18px;display:block;border:2px solid var(--panel);
}

.eyebrow{
  font-size:10.5px;font-weight:800;letter-spacing:.19em;color:var(--dim);
  margin-bottom:16px;
}

h1{
  font-size:clamp(30px,9vw,38px);line-height:1.06;font-weight:900;
  letter-spacing:-.02em;text-transform:uppercase;
}
h1 .l2{display:block;margin-top:4px}
h1 .pct{color:var(--cta)}

.req{
  margin:18px auto 0;max-width:340px;
  font-size:15px;line-height:1.45;color:var(--dim);
}
.req b{color:var(--alert);font-weight:800}
.req u{color:var(--ink);text-decoration:none;font-weight:700}

/* ---------- botoes ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:9px;
  width:100%;padding:18px 18px;margin-top:22px;border:0;border-radius:12px;
  font:900 16px/1.15 inherit;letter-spacing:.01em;text-decoration:none;
  text-transform:uppercase;cursor:pointer;
  background:var(--cta);color:#0a2318;
  transition:transform .12s ease,background .12s ease;
}
.btn:active{transform:translateY(1px);background:var(--cta2)}
.btn svg{width:20px;height:20px;flex:0 0 auto}
.btn.ghost{
  background:transparent;color:var(--ink);
  border:1px solid var(--line);font-weight:800;
}
.btn.ghost:active{background:var(--panel)}

/* ---------- escassez ---------- */
.scarce{margin-top:20px}
.scarce .txt{font-size:13.5px;font-weight:800;color:var(--alert);letter-spacing:.01em}
.track{
  margin-top:9px;height:9px;border-radius:99px;background:var(--panel);
  overflow:hidden;position:relative;
}
.fill{
  height:100%;border-radius:99px;background:var(--alert);
  width:0;transition:width .9s cubic-bezier(.22,1,.36,1);
}
.pct-lbl{margin-top:6px;font-size:11px;color:var(--faint);font-weight:700}

.fine{margin-top:20px;font-size:12px;line-height:1.55;color:var(--faint)}

/* ---------- rodape ---------- */
footer{background:var(--edge);padding:20px 0 30px;text-align:center}
footer p{font-size:10.5px;line-height:1.6;color:var(--faint)}
footer p+p{margin-top:7px}
footer a{color:var(--dim)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
/* ==================================================================
   TUDO QUE VOCE VAI QUERER MEXER ESTA AQUI.
   Nao precisa tocar no HTML nem no CSS.
   ================================================================== */
var CONFIG = {

  // ---- textos -------------------------------------------------
  eyebrow:  'SOMENTE PARA QUEM ENTRA NO CANAL',
  titulo1:  'CUPONS DE TECH',
  titulo2:  'ATE 50% OFF',

  // {obrigatorio} sai em vermelho, {destaque} sai em branco forte
  requisito: 'Pra receber os cupons do dia é {obrigatorio} {destaque} no canal do WhatsApp.',
  obrigatorio: 'OBRIGATÓRIO',
  destaque:    'ENTRAR',

  textoBotao: 'ENTRAR NO CANAL GRÁTIS',
  textoFino:  'Sem spam. Só ofertas reais. Você pode sair quando quiser.',

  // ---- destino ------------------------------------------------
  link: 'https://whatsapp.com/channel/0029VbCtLQF7IUYMZhrwvM2y',

  // ---- contador de vagas --------------------------------------
  // mostrar:false esconde o bloco inteiro.
  //
  // ATENCAO: isto e uma afirmacao factual pro consumidor.
  // Grupo de WhatsApp tem teto REAL de 1024 membros — entao da pra
  // ser verdade. Canal nao tem teto, entao aqui fica desligado ate
  // o destino virar um grupo. Numero inventado e propaganda enganosa
  // (CDC art. 37) e queima a confianca no primeiro membro que contar.
  vagas: {
    mostrar:  true,
    total:    1024,   // teto real do grupo de WhatsApp
    ocupadas: 0       // membros de hoje — atualizar de verdade
  }
};
/* ================= fim da area de edicao ========================= */

(function () {
  var $ = function (id) { return document.getElementById(id); };
  var origem = new URLSearchParams(location.search).get('utm_source') || 'direto';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  $('eyebrow').textContent      = CONFIG.eyebrow;
  $('h1a').textContent          = CONFIG.titulo1;
  $('h1b').textContent          = CONFIG.titulo2;
  $('btnEntrarTxt').textContent = CONFIG.textoBotao;
  $('fine').textContent         = CONFIG.textoFino;
  $('btnEntrar').href           = CONFIG.link;

  $('req').innerHTML = esc(CONFIG.requisito)
    .replace('{obrigatorio}', '<b>' + esc(CONFIG.obrigatorio) + '</b>')
    .replace('{destaque}',    '<u>' + esc(CONFIG.destaque)    + '</u>');

  var v = CONFIG.vagas;
  if (v && v.mostrar && v.total > 0) {
    var restam = Math.max(0, v.total - v.ocupadas);
    var pct    = Math.min(100, Math.round(v.ocupadas / v.total * 100));
    $('scarceTxt').textContent = 'CORRA, restam ' + restam.toLocaleString('pt-BR') + ' vagas.';
    $('pctLbl').textContent    = pct + '%';
    $('scarce').hidden = false;
    requestAnimationFrame(function () { $('fill').style.width = pct + '%'; });
  }

  // Lead = entrar no canal. E a conversao que o anuncio otimiza.
  $('btnEntrar').addEventListener('click', function () {
    if (window.fbq) fbq('track', 'Lead', { content_name: 'canal-wpp', source: origem });
    if (window.ttq) ttq.track('ClickButton', { content_name: 'canal-wpp' });
  });

  // Ver cupons = navegacao interna, evento proprio, nao polui o Lead.
  $('btnCupons').addEventListener('click', function () {
    if (window.fbq) fbq('trackCustom', 'VerCupons', { source: origem });
  });
})();
</script>
