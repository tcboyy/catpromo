<style>
/* ==================================================================
   Cores e medidas extraidas pixel a pixel do print de referencia
   (968x1282). Fator de escala aplicado: 2x -> viewport de 484px.
   ================================================================== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --page:#0d0d0d;      /* fundo da pagina                 */
  --card:#191919;      /* coluna central                  */
  --badge:#17252f;     /* fundo do selo do topo           */
  --ink:#ffffff;
  --body:#dee5ed;      /* texto corrido                   */
  --dim:#8e8e8e;
  --faint:#474747;     /* "VER CUPONS"                    */
  --yellow:#ffe235;    /* 2a linha do titulo              */
  --red:#fd3337;       /* "OBRIGATORIO"                   */
  --blue:#0c90f8;      /* botao principal                 */
  --blue2:#0476cb;     /* preenchimento da barra          */
  --track:#171717;     /* trilho da barra                 */
  --wrap:484px;        /* 968 / 2                         */
}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--page);color:var(--ink);
  font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;justify-content:center;
}
.card{
  width:100%;max-width:var(--wrap);background:var(--card);
  padding:26px 28px 34px;text-align:center;
  display:flex;flex-direction:column;min-height:100vh;
}

/* ---------- logo ---------- */
.logo{
  width:104px;height:104px;border-radius:50%;object-fit:cover;
  margin:4px auto 22px;display:block;
}

/* ---------- selo ---------- */
.badge{
  background:var(--badge);border-radius:8px;
  padding:8px 12px;margin-bottom:26px;
  font-size:11.5px;font-weight:800;letter-spacing:.13em;
  color:#cfe0ee;text-transform:uppercase;line-height:1.3;
}

/* ---------- titulo ---------- */
h1{line-height:1.02;letter-spacing:-.015em;text-transform:uppercase;font-weight:900}
h1 .l1{display:block;font-size:clamp(30px,8.6vw,40px);color:var(--ink)}
h1 .l2{display:block;font-size:clamp(24px,6.8vw,32px);color:var(--yellow);margin-top:8px}

/* ---------- requisito ---------- */
.req{
  margin:26px auto 0;max-width:330px;
  font-size:16px;line-height:1.42;color:var(--body);font-weight:500;
}
.req b{display:block;color:var(--red);font-weight:900;font-size:20px;
       letter-spacing:.02em;margin:4px 0}
.req u{text-decoration:none;color:var(--ink);font-weight:800}

/* ---------- botao principal ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;
  width:100%;min-height:77px;margin-top:28px;padding:12px 22px;
  border:0;border-radius:999px;background:var(--blue);color:#fff;
  font:900 18px/1.16 inherit;letter-spacing:.01em;text-transform:uppercase;
  text-decoration:none;cursor:pointer;
  transition:transform .12s ease,filter .12s ease;
}
.btn:active{transform:translateY(1px);filter:brightness(.9)}

/* ---------- escassez ---------- */
.scarce{margin-top:24px}
.scarce .txt{font-size:16px;font-weight:800;color:var(--ink)}
.track{
  display:flex;align-items:center;gap:10px;margin-top:12px;
}
.track .rail{
  flex:1;height:14px;border-radius:99px;background:var(--track);overflow:hidden;
}
.track .fill{
  height:100%;border-radius:99px;background:var(--blue2);
  width:0;transition:width .9s cubic-bezier(.22,1,.36,1);
}
.track .pct{font-size:13px;font-weight:800;color:var(--dim);min-width:38px;text-align:right}

/* ---------- rodape do bloco ---------- */
.fine{margin-top:22px;font-size:13px;line-height:1.5;color:var(--dim)}

.ghost{
  display:block;margin-top:20px;padding:14px;
  font-size:14px;font-weight:800;letter-spacing:.06em;
  color:var(--faint);text-decoration:none;text-transform:uppercase;
}
.ghost:active{color:var(--dim)}

.legal{margin-top:auto;padding-top:26px}
.legal p{font-size:10.5px;line-height:1.6;color:#3d3d3d}
.legal p+p{margin-top:6px}
.legal a{color:var(--faint)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>

<div class="card">

  <img class="logo" src="../cat-logo.png" alt="CAT TECH PROMO">

  <div class="badge" id="badge"></div>

  <h1>
    <span class="l1" id="h1a"></span>
    <span class="l2" id="h1b"></span>
  </h1>

  <p class="req" id="req"></p>

  <a class="btn" id="btnEntrar" href="#"><span id="btnEntrarTxt"></span></a>

  <div class="scarce" id="scarce" hidden>
    <div class="txt" id="scarceTxt"></div>
    <div class="track">
      <div class="rail"><div class="fill" id="fill"></div></div>
      <div class="pct" id="pctLbl"></div>
    </div>
  </div>

  <p class="fine" id="fine"></p>

  <a class="ghost" id="btnCupons" href="../cupons/">Ver cupons</a>

  <div class="legal">
    <p>PXC SERVICOS DE VENDAS ONLINE LTDA &middot; CNPJ 58.017.406/0001-67</p>
    <p>Cont&eacute;m links de afiliado. Podemos receber comiss&atilde;o da loja, sem custo adicional pra voc&ecirc;.</p>
    <p><a href="../">Site</a></p>
  </div>

</div>

<script>
/* ==================================================================
   TUDO QUE VOCE VAI QUERER MEXER ESTA AQUI.
   Nao precisa tocar em HTML nem CSS.
   ================================================================== */
var CONFIG = {

  // ---- textos -------------------------------------------------
  selo:    'SOMENTE PARA MEMBROS DO CANAL',
  titulo1: 'CUPONS DE TECH',
  titulo2: 'ATÉ 50% OFF +',

  // {obrigatorio} vira o bloco vermelho, {destaque} fica branco forte
  requisito:   'Para receber os cupons é {obrigatorio} {destaque} no canal do WhatsApp.',
  obrigatorio: 'OBRIGATÓRIO',
  destaque:    'ENTRAR',

  textoBotao: 'ENTRAR NO CANAL DO WHATSAPP',
  textoFino:  'Sem spam. Só ofertas reais. Você pode sair quando quiser.',

  // ---- destino ------------------------------------------------
  link: 'https://whatsapp.com/channel/0029VbCtLQF7IUYMZhrwvM2y',

  // ---- contador de vagas --------------------------------------
  // ATENCAO: e afirmacao factual pro consumidor.
  // Grupo de WhatsApp tem teto REAL de 1024 membros — entao pode ser
  // verdade. Canal nao tem teto. Numero inventado e propaganda
  // enganosa (CDC art. 37) e queima no primeiro membro que reparar
  // que o contador nao anda.
  vagas: {
    mostrar:  true,
    total:    1024,   // teto real do grupo de WhatsApp
    ocupadas: 0       // membros de hoje — manter atualizado
  }
};
/* ================= fim da area de edicao ========================= */

(function () {
  var $ = function (id) { return document.getElementById(id); };
  var origem = new URLSearchParams(location.search).get('utm_source') || 'direto';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  $('badge').textContent        = CONFIG.selo;
  $('h1a').textContent          = CONFIG.titulo1;
  $('h1b').textContent          = CONFIG.titulo2;
  $('btnEntrarTxt').textContent = CONFIG.textoBotao;
  $('fine').textContent         = CONFIG.textoFino;
  $('btnEntrar').href           = CONFIG.link;

  $('req').innerHTML = esc(CONFIG.requisito)
    .replace('{obrigatorio}', '<b>' + esc(CONFIG.obrigatorio) + '</b>')
    .replace('{destaque}',    '<u>' + esc(CONFIG.destaque)    + '</u>');

  var v = CONFIG.vagas;
  if (v && v.mostrar && v.total > 0) {
    var restam = Math.max(0, v.total - v.ocupadas);
    var pct    = Math.min(100, Math.round(v.ocupadas / v.total * 100));
    $('scarceTxt').textContent = 'CORRA, restam ' + restam.toLocaleString('pt-BR') + ' vagas.';
    $('pctLbl').textContent    = pct + '%';
    $('scarce').hidden = false;
    requestAnimationFrame(function () { $('fill').style.width = pct + '%'; });
  }

  // Lead = entrar no canal. E a conversao que o anuncio otimiza.
  $('btnEntrar').addEventListener('click', function () {
    if (window.fbq) fbq('track', 'Lead', { content_name: 'canal-wpp', source: origem });
    if (window.ttq) ttq.track('ClickButton', { content_name: 'canal-wpp' });
  });

  // Navegacao interna: evento proprio, nao polui o Lead.
  $('btnCupons').addEventListener('click', function () {
    if (window.fbq) fbq('trackCustom', 'VerCupons', { source: origem });
  });
})();
</script>
