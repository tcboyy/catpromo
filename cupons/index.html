<style>
/* ==================================================================
   Estrutura e paleta reproduzidas da referencia, valor por valor:
   fundo #0F1115, secao em degrade 167deg #181B20 -> #1A141F,
   verde #29DC18/#52E081, azul Telegram #2AABEE, cinza #69727D,
   Rajdhani nos titulos e Inter no texto.
   ================================================================== */
@font-face{font-family:'Rajdhani';font-style:normal;font-weight:500;font-display:swap;src:url('../fontes/rajdhani-500.woff2') format('woff2')}
@font-face{font-family:'Rajdhani';font-style:normal;font-weight:600;font-display:swap;src:url('../fontes/rajdhani-600.woff2') format('woff2')}
@font-face{font-family:'Rajdhani';font-style:normal;font-weight:700;font-display:swap;src:url('../fontes/rajdhani-700.woff2') format('woff2')}
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url('../fontes/inter-400.woff2') format('woff2')}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0F1115;
  --sec:linear-gradient(167deg,#181B20 0%,#1A141F 100%);
  --card:#181B20;
  --line:rgba(255,255,255,.07);
  --ink:#fff;
  --dim:#69727D;
  --verde:#29DC18;
  --verde2:#52E081;
  --wpp:#25D366;
  --wpp-dark:#16a34a;
  --tg:#2AABEE;
  --tg-light:#60c8f5;
  --wrap:520px;
}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--ink);
  font:400 16px/1.55 'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
.wrap{width:100%;max-width:var(--wrap);margin:0 auto;padding:0 20px}
h1,h2,h3,.rajd{font-family:'Rajdhani','Inter',sans-serif}

/* ---------- faixa do topo ---------- */
.faixa{
  background:linear-gradient(90deg,#29DC18 0%,#52E081 25%,#29DC18 50%,#52E081 75%,#29DC18 100%);
  background-size:200% 100%;animation:desliza 6s linear infinite;
  color:#08240a;text-align:center;padding:9px 16px;
  font-size:12px;font-weight:800;letter-spacing:.01em;line-height:1.35;
}
@keyframes desliza{0%{background-position:0% 0}100%{background-position:200% 0}}

/* ---------- hero ---------- */
.hero{padding:34px 0 40px;text-align:center}
.marca{
  width:92px;height:92px;border-radius:50%;object-fit:cover;
  margin:0 auto 18px;display:block;border:3px solid rgba(41,220,24,.5);
}
h1{
  font-size:clamp(30px,8.6vw,42px);font-weight:700;line-height:1.05;
  letter-spacing:-.01em;text-transform:uppercase;
}
h1 .verde{color:var(--verde)}
.sub{
  margin:16px auto 0;max-width:380px;font-size:15px;line-height:1.55;color:#aeb6bf;
}
.sub b{color:var(--ink);font-weight:600}

/* ---------- botoes ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:17px 20px;margin-top:14px;border:0;border-radius:12px;
  font-family:'Rajdhani','Inter',sans-serif;
  font-size:19px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;
  text-decoration:none;cursor:pointer;color:#fff;
  transition:transform .12s ease,filter .12s ease;
}
.btn:active{transform:translateY(1px);filter:brightness(.93)}
.btn svg{width:22px;height:22px;fill:currentColor;flex:0 0 auto}
.btn-wpp{
  background:linear-gradient(135deg,var(--wpp) 0%,#1ebe5a 60%,var(--wpp-dark) 100%);
  box-shadow:0 8px 26px rgba(37,211,102,.3);
}
.btn-tg{
  background:linear-gradient(135deg,var(--tg-light) 0%,var(--tg) 60%,#0088cc 100%);
  box-shadow:0 8px 26px rgba(42,171,238,.28);
}

/* ---------- prova social ---------- */
.contagem{margin-top:26px}
.contagem .n{
  font-family:'Rajdhani','Inter',sans-serif;
  font-size:34px;font-weight:700;line-height:1;color:var(--verde);
}
.contagem .t{font-size:13px;color:var(--dim);margin-top:3px}

/* ---------- secao de beneficios ---------- */
.sec{background:var(--sec);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:44px 0}
h2{
  font-size:clamp(24px,6.6vw,32px);font-weight:700;line-height:1.12;
  text-align:center;text-transform:uppercase;letter-spacing:-.005em;
}
h2 .verde{color:var(--verde)}
.lista{display:grid;gap:10px;margin-top:26px}
.item{
  display:flex;align-items:center;gap:13px;
  background:rgba(255,255,255,.03);border:1px solid var(--line);
  border-radius:12px;padding:14px 15px;
}
.item .ic{
  width:38px;height:38px;flex:0 0 auto;border-radius:10px;
  background:rgba(41,220,24,.12);border:1px solid rgba(41,220,24,.22);
  display:flex;align-items:center;justify-content:center;font-size:19px;
}
.item p{font-size:14.5px;line-height:1.4;font-weight:500}
.item.destaque{background:rgba(41,220,24,.08);border-color:rgba(41,220,24,.3)}

/* ---------- fechamento ---------- */
.fim{padding:44px 0 50px;text-align:center}
.selo-vagas{
  display:inline-flex;align-items:center;gap:7px;
  background:rgba(217,83,79,.12);border:1px solid rgba(217,83,79,.32);
  color:#ff6b66;font-size:12px;font-weight:800;letter-spacing:.06em;
  padding:6px 13px;border-radius:99px;margin-bottom:16px;text-transform:uppercase;
}
.fim p{margin:14px auto 0;max-width:360px;font-size:14.5px;line-height:1.55;color:#aeb6bf}

/* ---------- rodape ---------- */
footer{border-top:1px solid var(--line);padding:24px 0 34px;text-align:center}
footer p{font-size:11.5px;line-height:1.6;color:#4a515a}
footer p+p{margin-top:6px}
footer a{color:var(--dim)}

/* ---------- toast de prova social ---------- */
.social-proof-float{
  position:fixed;left:14px;bottom:14px;z-index:40;
  display:flex;align-items:center;gap:11px;
  background:rgba(24,27,32,.96);border:1px solid var(--line);
  border-radius:14px;padding:10px 14px 10px 11px;
  box-shadow:0 12px 34px rgba(0,0,0,.55);
  max-width:calc(100vw - 28px);
  opacity:0;transform:translateY(12px);pointer-events:none;
  transition:opacity .3s ease,transform .3s ease;
}
.social-proof-float.on{opacity:1;transform:none}
.sp-icon{
  width:34px;height:34px;flex:0 0 auto;border-radius:50%;
  background:rgba(37,211,102,.14);border:1px solid rgba(37,211,102,.3);
  display:flex;align-items:center;justify-content:center;
}
.sp-icon svg{width:17px;height:17px;fill:var(--wpp)}
.sp-content{min-width:0}
.sp-content b{display:block;font-size:13px;font-weight:700;line-height:1.25}
.sp-content span{display:block;font-size:11.5px;color:var(--dim);line-height:1.3}

@media (min-width:560px){.hero{padding:44px 0 50px}.sec{padding:56px 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.1 3.51a1.2 1.2 0 0 0-1.04-.3L2.73 7.23c-.47.11-.81.5-.89.98-.08.48.12.96.51 1.22l4.15 2.76 3.13 6.08c.21.41.64.64 1.1.62.43-.02.83-.28 1.02-.66l2.04-4.08 4.71 3.36c.3.21.67.27 1.01.16.36-.11.63-.38.74-.74l1.66-12.54c.06-.5-.53-.61-.8-.88ZM6.97 11.53 4.14 9.65l13.63-3.17-10.8 5.05Zm9.36 4.13-3.78-2.69 3.36-3.79.42 6.48Z"/></svg>

    </div>
  </div>

  </div>
</section>

  <div class="wrap">
    <div class="selo-vagas" id="seloVagas"></div>
    <h2 id="fimTitulo"></h2>

    <a class="btn btn-wpp" id="btnWpp2" href="#">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2Zm0 18.15h-.01a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.19 8.19 0 0 1-1.26-4.38c0-4.54 3.7-8.23 8.25-8.23 2.2 0 4.27.86 5.83 2.41a8.2 8.2 0 0 1 2.41 5.83c0 4.54-3.7 8.23-8.24 8.23Zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.16.24-.64.8-.78.97-.15.16-.29.18-.53.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.71-.14-.25-.01-.38.11-.5.11-.11.25-.29.37-.43.13-.15.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.42-.56-.43h-.47c-.17 0-.43.06-.66.31-.23.25-.86.85-.86 2.06 0 1.22.89 2.39 1.01 2.56.12.16 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.47-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.14-1.18-.06-.11-.22-.17-.47-.29Z"/></svg>

<div class="social-proof-float" id="toast" aria-hidden="true">
  <div class="sp-icon">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.55 17.6 4.4 12.45l1.5-1.5 3.65 3.65 8.55-8.55 1.5 1.5z"/></svg>
  </div>
  <div class="sp-content">
    <b id="spNome"></b>
    <span id="spTexto"></span>
  </div>
</div>

<script>
/* ==================================================================
   AREA DE EDICAO
   ================================================================== */
var CONFIG = {

  link:   'https://whatsapp.com/channel/0029VbCtLQF7IUYMZhrwvM2y',
  linkTg: '',            // vazio esconde os botoes de Telegram

  faixa: '⚡ As melhores ofertas de tech chegam primeiro para quem está no canal ⚡',

  titulo1: 'Cupons de tech',
  titulo2: 'direto no seu',
  titulo3: 'celular!',     // sai em verde

  sub: 'Receba cupons e ofertas <b>conferidas uma a uma</b> em hardware, periféricos e tecnologia — sem precisar ficar caçando promoção.',

  botaoWpp: 'Entrar no canal do WhatsApp',
  botaoTg:  'Entrar no grupo do Telegram',

  // Numero e legenda da prova social do hero.
  // Deixe contagem:'' para esconder o bloco inteiro.
  contagem: '3 por dia',
  contagemTexto: 'ofertas conferidas, sem enxurrada de link',

  tituloLista1: 'O que você encontra no',
  tituloLista2: 'CAT TECH PROMO',   // sai em verde
  itens: [
    { ic: '\u{1F5A5}️', txt: 'Hardware e componentes de PC em tempo real' },
    { ic: '\u{1F5B1}️', txt: 'Periféricos e acessórios com desconto de verdade' },
    { ic: '\u{1F3AB}', txt: 'Cupons exclusivos de marketplaces' },
    { ic: '\u{1F3AE}', txt: 'Games, consoles e assinaturas em promoção' },
    { ic: '\u{1F4F1}', txt: 'Celulares, gadgets e lançamentos' },
    { ic: '\u{1F4C9}', txt: 'Preço checado antes: se subiu pra "cair", não entra', destaque: true },
    { ic: '✅', txt: 'Só oferta conferida, zero spam', destaque: true }
  ],

  seloVagas: '⚡ Vagas limitadas',
  fimTitulo1: 'Não perca mais tempo',
  fimTitulo2: 'procurando oferta.',
  fimTexto: 'Entra agora e começa a economizar em tech. As ofertas do dia já estão no canal.',

  rodape: 'Contém links de afiliado. Podemos receber comissão da loja, sem custo adicional pra você.',

  // ---- toast de prova social ----------------------------------
  // ATENCAO: nome inventado dizendo que "acabou de entrar" e
  // afirmacao falsa ao consumidor. Por isso o padrao aqui anuncia a
  // oferta, nao uma entrada ficticia. Se um dia houver dado real de
  // entrada, e so trocar os textos.
  toast: {
    ativo: true,
    primeiro: 9000,     // ms ate o primeiro
    intervalo: 26000,   // ms entre um e outro
    duracao: 6000,      // ms na tela
    mensagens: [
      { nome: 'Oferta de hoje', txt: 'já foi publicada no canal' },
      { nome: 'Cupom novo', txt: 'liberado agora no canal' },
      { nome: 'Preço conferido', txt: 'menor valor dos últimos 90 dias' }
    ]
  }
};
/* ================= fim da area de edicao ========================= */

(function () {
  var $ = function (id) { return document.getElementById(id); };
  var origem = new URLSearchParams(location.search).get('utm_source') || 'direto';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  // ---- textos ----
  $('faixa').textContent = CONFIG.faixa;
  $('titulo').innerHTML =
    esc(CONFIG.titulo1) + '<br>' + esc(CONFIG.titulo2) +
    '<br><span class="verde">' + esc(CONFIG.titulo3) + '</span>';
  $('sub').innerHTML = CONFIG.sub;   // aceita <b> proposital, texto nosso

  $('h2').innerHTML = esc(CONFIG.tituloLista1) +
    '<br><span class="verde">' + esc(CONFIG.tituloLista2) + '</span>';
  $('seloVagas').textContent = CONFIG.seloVagas;
  $('fimTitulo').innerHTML = esc(CONFIG.fimTitulo1) + '<br>' + esc(CONFIG.fimTitulo2);
  $('fimTexto').textContent = CONFIG.fimTexto;
  $('rodape').textContent = CONFIG.rodape;

  // ---- contagem do hero ----
  if (CONFIG.contagem) {
    $('contN').textContent = CONFIG.contagem;
    $('contT').textContent = CONFIG.contagemTexto || '';
  } else {
    $('contagem').style.display = 'none';
  }

  // ---- lista de beneficios ----
  $('lista').innerHTML = (CONFIG.itens || []).map(function (i) {
    return '<div class="item' + (i.destaque ? ' destaque' : '') + '">' +
             '<div class="ic">' + esc(i.ic) + '</div>' +
             '<p>' + esc(i.txt) + '</p>' +
           '</div>';
  }).join('');

  // ---- botoes ----
  [['btnWpp','btnWppTxt'],['btnWpp2','btnWpp2Txt']].forEach(function (par) {
    $(par[0]).href = CONFIG.link;
    $(par[1]).textContent = CONFIG.botaoWpp;
    $(par[0]).addEventListener('click', function () {
      if (window.fbq) fbq('track', 'Lead', { content_name: 'cupons-wpp', source: origem });
      if (window.ttq) ttq.track('ClickButton', { content_name: 'cupons-wpp' });
    });
  });

  [['btnTg','btnTgTxt'],['btnTg2','btnTg2Txt']].forEach(function (par) {
    if (!CONFIG.linkTg) { $(par[0]).style.display = 'none'; return; }
    $(par[0]).href = CONFIG.linkTg;
    $(par[1]).textContent = CONFIG.botaoTg;
    $(par[0]).addEventListener('click', function () {
      if (window.fbq) fbq('track', 'Lead', { content_name: 'cupons-tg', source: origem });
    });
  });

  // ---- toast de prova social ----
  (function () {
    var t = CONFIG.toast || {};
    if (!t.ativo || !(t.mensagens || []).length) return;
    var el = $('toast'), i = 0;

    function mostra() {
      var m = t.mensagens[i % t.mensagens.length]; i++;
      $('spNome').textContent  = m.nome;
      $('spTexto').textContent = m.txt;
      el.classList.add('on');
      setTimeout(function () { el.classList.remove('on'); }, t.duracao || 6000);
    }
    setTimeout(function () {
      mostra();
      setInterval(mostra, t.intervalo || 26000);
    }, t.primeiro || 9000);
  })();
})();
</script>
