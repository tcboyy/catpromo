  0%{top:50%;left:50%}25%{top:30%;left:65%}50%{top:20%;left:50%}

.btn::before{

  animation:pulseGreen 2.5s ease-in-out infinite;

  animation:shimmerWpp 3s ease-in-out infinite;

    { ic: '\u{1F3AB}',       txt: 'Cupons exclusivos de Marketplaces' },
    { ic: '\u{1F3AE}',       txt: 'Games, DLCs e Assinaturas em promo\u00E7\u00E3o' },
    { ic: '\u{1F4F1}',       txt: 'Gadgets e Inova\u00E7\u00F5es Tech' },
    { ic: '\u{1F4BB}',       txt: 'Componentes para PC, Notebooks e Consoles' },
    { ic: '\u2705',          txt: 'Apenas ofertas verificadas, zero spam!', destaque: true }
  ],

  seloVagas: '\u26A1 Vagas limitadas',
  fimTitulo1: 'N\u00E3o perca mais tempo',
  fimTitulo2: 'procurando ofertas.',
  fimTexto: 'Entre agora e comece a economizar em tech. Milhares de membros j\u00E1 est\u00E3o recebendo as melhores ofertas diariamente.',

  rodape: 'Curadoria tech para quem valoriza economia inteligente',

  toast: {
    ativo: true,
    primeiro: 7000,
    intervalo: 18000,
    duracao: 5500,
    sufixo: 'acabou de entrar no Grupo VIP',
    nomes: [
      'Rodrigo Vieira', 'Camila Souza', 'Lucas Andrade', 'Bruna Martins',
      'Thiago Ramos', 'Juliana Costa', 'Felipe Moreira', 'Amanda Rocha',
      'Gustavo Lima', 'Patr\u00EDcia Alves', 'Rafael Nunes', 'Larissa Campos'
    ]
  }
};
/* ================= fim da area de edicao ========================= */

(function () {
  var $ = function (id) { return document.getElementById(id); };
  var origem = new URLSearchParams(location.search).get('utm_source') || 'direto';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  // ---- textos ----
  $('faixa').textContent = CONFIG.faixa;
  // Na referencia o titulo flui e quebra sozinho; so a ultima
  // palavra sai no degrade recortado.
  $('titulo').innerHTML =
    esc(CONFIG.titulo1) + ' ' + esc(CONFIG.titulo2) +
    ' <span class="grad">' + esc(CONFIG.titulo3) + '</span>';
  $('sub').innerHTML = CONFIG.sub;   // aceita <b> proposital, texto nosso

  $('h2').innerHTML = esc(CONFIG.tituloLista1) +
    ' <span class="grad">' + esc(CONFIG.tituloLista2) + '</span>';
  $('seloVagas').textContent = CONFIG.seloVagas;
  $('fimTitulo').innerHTML = esc(CONFIG.fimTitulo1) + ' ' + esc(CONFIG.fimTitulo2);
  $('fimTexto').textContent = CONFIG.fimTexto;
  $('rodape').textContent = CONFIG.rodape;

  // ---- contagem do hero ----
  if (CONFIG.contagem) {
    $('contN').textContent = CONFIG.contagem;
    $('contT').textContent = CONFIG.contagemTexto || '';
  } else {
    $('contagem').style.display = 'none';
  }

  // ---- lista de beneficios ----
  $('lista').innerHTML = (CONFIG.itens || []).map(function (i) {
    return '<div class="item' + (i.destaque ? ' destaque' : '') + '">' +
             '<div class="ic">' + esc(i.ic) + '</div>' +
             '<p>' + esc(i.txt) + '</p>' +
           '</div>';
  }).join('');

  // ---- botoes ----
  [['btnWpp','btnWppTxt'],['btnWpp2','btnWpp2Txt']].forEach(function (par) {
    $(par[0]).href = CONFIG.link;
    $(par[1]).textContent = CONFIG.botaoWpp;
    $(par[0]).addEventListener('click', function () {
      if (window.fbq) fbq('track', 'Lead', { content_name: 'cupons-wpp', source: origem });
      if (window.ttq) ttq.track('ClickButton', { content_name: 'cupons-wpp' });
    });
  });

  [['btnTg','btnTgTxt'],['btnTg2','btnTg2Txt']].forEach(function (par) {
    if (!CONFIG.linkTg) { $(par[0]).style.display = 'none'; return; }
    $(par[0]).href = CONFIG.linkTg;
    $(par[1]).textContent = CONFIG.botaoTg;
    $(par[0]).addEventListener('click', function () {
      if (window.fbq) fbq('track', 'Lead', { content_name: 'cupons-tg', source: origem });
    });
  });

  // ---- toast de prova social ----
  (function () {
    var t = CONFIG.toast || {};
    if (!t.ativo || !(t.nomes || []).length) return;
    var el = $('toast');
    var fila = t.nomes.slice(), i = 0;

    function mostra() {
      $('spNome').textContent  = fila[i % fila.length];
      $('spTexto').textContent = t.sufixo || '';
      i++;
      el.classList.add('active');
      setTimeout(function () { el.classList.remove('active'); }, t.duracao || 5500);
    }
    setTimeout(function () {
      mostra();
      setInterval(mostra, t.intervalo || 18000);
    }, t.primeiro || 7000);
  })();
})();
</script>

</body>
